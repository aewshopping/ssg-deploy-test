Source: "Habsburg Monarchy 1789.svg" by Wikimedia user Alphathon (2013), CC BY-SA 3.0
(https://creativecommons.org/licenses/by-sa/3.0/), derived from his "Europe 1789.svg" and

This modified version is released under the same licence. Keep this notice when reusing it.
Also used:
- "HRR 1789.png" by Wikimedia user Ziegelbrenner, the German map Alphathon's German borders were
  traced from; used to identify territories (see its Commons page for its licence).
- Alphathon's "Map Holy Roman Empire 1789.svg", "Electorate of Brunswick-Lueneburg 1789.svg" and
  "Duchy of Holstein 1789.svg" (CC BY-SA 3.0), to confirm several identifications.
- Natural Earth (public domain), to georeference the map and to draw the Milan/Mantua border.
- SVGO 4.1.0 (github.com/svg/svgo) and mapshaper 0.7 (github.com/mbloch/mapshaper), open source.
Modified 2 and 3 November 2026 by Claude Opus 5.5 (an AI model made by Anthropic) at a user's request.
Changes
- Every territory has an id, data-name and <title>. The id is the data-name with accents removed and
  other non-alphanumeric characters replaced by "_", plus "_2", "_3" ... where a polity has several
  shapes. Territories were identified by georeferencing the map and reading HRR 1789.png.
  Source typos corrected ("Kingdom of Napels", "Grand Duchy of Warsaw" = Polish-Lithuanian Commonwealth).
- Habsburg Monarchy split into its main body, Austrian Netherlands, Duchy of Milan, Duchy of Mantua,
  Further Austria, Margraviate of Burgau and Lordship of Tarasp, named "..., Habsburg Monarchy" and
  grouped as Habsburg_Monarchy. The Milan/Mantua border is new and approximate (western edge of the
  modern province of Mantua). Church lands of Trent, Brixen and Freising inside the Habsburg lands kept.
- Holy Roman Empire simplified: only Prussia (lands in the Empire), Palatinate-Bavaria (Bavaria,
  Rhenish Palatinate, Juelich, Berg), Saxony, Hanover, the Muenster/Paderborn/Osnabrueck bishoprics and
  the Wuerzburg/Bamberg/Fulda bishoprics are kept; all other German territories form one shape,
  "Holy Roman Empire states". Kept states keep only pieces of at least 2,000 km2 and have their
  enclaves filled, so their borders are generalised, not exact.
- Prussia's lands outside the Empire are a separate shape (East and West Prussia).
- Removed: the lakes layer, an unlabelled dotted line in Lombardy, a duplicate Prussian border line, an empty
  background shape, clip-paths with no visible effect, and leftover editor groups.
- Colours: Tuscany pale green (Habsburg secundogeniture, data-habsburg-relation attribute), Kingdom of
  Naples light blue, Duchy of Parma light red, Duchy of Bouillon standard grey.
- All outlines are 0.6 px at the native 450 px width.
- File size: all paths converted exactly into one pixel coordinate system (viewBox 0 0 450 456);
  outlines rebuilt during this work simplified together with mapshaper (Visvalingam, 0.1 px,
  keep-shapes); then SVGO, coordinates rounded to 1 decimal place (0.1 px).-->

<title id="title4">A map of Habsburg Monarchy within the Holy Roman Empire and Europe ca. 1789</title>
<desc id="desc6">A map of the Habsburg Monarchy within the Holy Roman Empire, and within Europe, circa 1789. This map is licensed under the Creative Commons Attribution-Share Alike 3.0 Unported license (https://creativecommons.org/licenses/by-sa/3.0/) by the wikimedia user &quot;Alphathon&quot; (http://commons.wikimedia.org/wiki/User:Alphathon), and is based upon &quot;Blank map of Europe.svg&quot; (http://commons.wikimedia.org/wiki/File:Blank_map_of_Europe.svg), the details of which follow:
A blank Map of Europe. Every country has an id which is its ISO-3166-1-ALPHA2 code in lower case.
Members of the EU have a class=&quot;eu&quot;, countries in europe (which I found turkey to be but russia not) have a class=&quot;europe&quot;.
Certain countries are further subdivided the United Kingdom has gb-gbn for Great Britain and gb-nir for Northern Ireland. Russia is divided into ru-kgd for the Kaliningrad Oblast and ru-main for the Main body of Russia. There is the additional grouping #xb for the &quot;British Islands&quot; (the UK with its Crown Dependencies - Jersey, Guernsey and the Isle of Man)
Contributors.
Original Image: (http://commons.wikimedia.org/wiki/Image:Europe_countries.svg) Júlio Reis (http://commons.wikimedia.org/wiki/User:Tintazul).
Recolouring and tagging with country codes: Marian &quot;maix&quot; Sigler (http://commons.wikimedia.org/wiki/User:Maix)
Improved geographical features: http://commons.wikimedia.org/wiki/User:W!B:
Updated to reflect dissolution of Serbia &amp; Montenegro: http://commons.wikimedia.org/wiki/User:Zirland
Updated to include British Crown Dependencies as seperate entities and regroup them as &quot;British Islands&quot;, with some simplifications to the XML and CSS: James Hardy (http://commons.wikimedia.org/wiki/User:MrWeeble)
Validated (http://commons.wikimedia.org/wiki/User:CarolSpears)
Changed the country code of Serbia to RS per http://en.wikipedia.org/wiki/Serbian_country_codes and the file http://www.iso.org/iso/iso3166_en_code_lists.txt (http://commons.wikimedia.org/wiki/User:TimothyBourke)
Uploaded on behalf of User:Checkit, direct complaints to him plox: &apos;Moved countries out of the &quot;outlines&quot; group, removed &quot;outlines&quot; style class, remove separate style information for Russia&apos; (http://commons.wikimedia.org/wiki/User:Collard)
Updated various coastlines and boarders and added various islands not previously shown (details follow). Added Kosovo and Northern Cyprus as disputed territories. Moved major lakes to their own object and added more. List of updated boarders/coastlines: British Isles (+ added Isle of Wight, Skye, various smaller islands), the Netherlands, Germany, Czech Republic, Denmark, Sweden, Finland, Poland, Kaliningrad Oblast of the Russian Federation (and minor tweaks to Lithuania), Ukraine, Moldova (minor), Romania, Bulgaria, Turkey, Greece, F.Y.R. Macedonia, Serbia, Bosnia and Herzegovina, Montenegro, Albania, Croatia, Italy (mainland and Sicily), Malta (http://commons.wikimedia.org/wiki/User:Alphathon).
Added Bornholm (http://commons.wikimedia.org/wiki/User:Heb)
Released under CreativeCommons Attribution ShareAlike (http://creativecommons.org/licenses/by-sa/2.5/).
Modified 2-3 November 2026 by Claude Opus 5.5 (Anthropic); see the XML comment at the top of this file.</desc>
